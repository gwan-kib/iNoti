<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="../assets/inoti-logo.png">
  <title>iNoti</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>
  <main>
    <div class="brand"><img class="brand-logo" src="../assets/inoti-logo.png" alt=""><span class="brand-text">iNoti</span></div>
    <p class="eyebrow"><span class="eyebrow-text">Development build</span></p>
    <h1 class="popup-title"><span class="popup-title-text">Alert appearance</span></h1>
    <label class="pulse-setting" for="pulse-alerts"><input id="pulse-alerts" type="checkbox" disabled aria-describedby="pulse-description"><span class="pulse-label">Pulse new-question background</span></label>
    <p id="pulse-description"><span class="popup-description-text">Turn off for a solid alert color. Reduced-motion preferences also disable pulsing.</span></p>
    <p id="preference-status" class="preference-status" role="status"></p>
    <h2 class="tools-title"><span class="tools-title-text">Testing tools</span></h2>
    <p class="popup-description"><span class="popup-description-text">Open the isolated tester to preview alert states without joining an iClicker class.</span></p>
    <button id="open-dev-tester" type="button"><span class="button-text">Open Dev Tester</span></button>
  </main>
  <script src="./popup.js"></script>
</body>
</html>

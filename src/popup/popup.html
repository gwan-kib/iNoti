<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../assets/inoti-logo.png" />
    <title>iNoti</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=blur_circular,volume_up,music_note,expand_more,play_arrow,open_in_new&display=block"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <div class="popup-header">
        <div class="brand">
          <img class="brand-logo" src="../assets/inoti-logo.png" alt="" /><span class="brand-text">iNoti</span>
        </div>
        <nav class="popup-links" aria-label="Project links">
          <a
            class="social-link"
            href="https://www.linkedin.com/in/gwantanakiboigo/"
            target="_blank"
            rel="noreferrer noopener"
            aria-label="LinkedIn profile"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 0 1-2.063-2.065 2.064 2.064 0 1 1 2.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"
              />
            </svg>
            <a
              class="social-link"
              href="https://github.com/gwan-kib/iNoti"
              target="_blank"
              rel="noreferrer noopener"
              aria-label="GitHub repository"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.84 1.237 1.84 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.605-2.665-.303-5.466-1.332-5.466-5.93 0-1.31.468-2.38 1.235-3.22-.123-.303-.535-1.523.117-3.176 0 0 1.008-.322 3.3 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.29-1.552 3.297-1.23 3.297-1.23.653 1.653.24 2.873.118 3.176.77.84 1.233 1.91 1.233 3.22 0 4.61-2.804 5.624-5.476 5.92.43.372.813 1.102.813 2.222 0 1.606-.014 2.898-.014 3.293 0 .322.216.694.825.576C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"
                />
              </svg>
            </a>
          </a>
        </nav>
      </div>
      <div class="settings">
        <div class="setting-card">
          <span class="setting-icon" aria-hidden="true"
            ><span class="material-symbols-rounded">blur_circular</span></span
          >
          <div class="setting-copy">
            <label class="toggle-label" for="pulse-alerts"><span>Pulse iNoti background</span></label>
            <p id="pulse-description" class="setting-description">
              <span>When a new iClicker question is detected</span>
            </p>
          </div>
          <input
            class="setting-checkbox"
            id="pulse-alerts"
            type="checkbox"
            checked
            disabled
            aria-describedby="pulse-description"
          />
        </div>
        <div class="setting-card">
          <span class="setting-icon" aria-hidden="true"><span class="material-symbols-rounded">volume_up</span></span>
          <div class="setting-copy">
            <label class="toggle-label" for="sound-alerts"><span>Play sound</span></label>
            <p id="sound-description" class="setting-description">
              <span>When a new iClicker question is detected</span>
            </p>
          </div>
          <input
            class="setting-checkbox"
            id="sound-alerts"
            type="checkbox"
            checked
            disabled
            aria-describedby="sound-description"
          />
        </div>
        <div class="setting-card sound-choice">
          <span class="setting-icon" aria-hidden="true"><span class="material-symbols-rounded">music_note</span></span>
          <label class="sound-choice-label" for="sound-choice"
            ><span class="sound-choice-label-text">Sound</span></label
          >
          <div class="select-wrap">
            <select id="sound-choice" disabled></select>
            <span class="material-symbols-rounded select-chevron" aria-hidden="true">expand_more</span>
          </div>
        </div>
      </div>
      <p id="preference-status" class="preference-status" role="status"></p>
      <div class="popup-actions">
        <button id="test-sound" class="sound-test" type="button">
          <span class="material-symbols-rounded button-icon" aria-hidden="true">play_arrow</span
          ><span class="button-text">Test sound</span>
        </button>
        <button id="open-dev-tester" type="button">
          <span class="material-symbols-rounded button-icon" aria-hidden="true">open_in_new</span
          ><span class="button-text">Dev testing</span>
        </button>
      </div>
    </main>
    <script src="./popup.js"></script>
  </body>
</html>
